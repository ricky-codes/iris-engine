# Ambiente de desenvolvimento. As credenciais abaixo são só para uso local.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris
      POSTGRES_DB: iris
    # Só acessível a partir deste computador (127.0.0.1), numa porta pouco comum para não
    # chocar com um Postgres já instalado. Os outros serviços falam com ele pela rede interna
    # do Docker, por isso esta porta só serve para ferramentas como o psql.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U iris -d iris']
      interval: 3s
      timeout: 3s
      retries: 20

  # Corre as migrações e termina. O serviço só arranca depois de ele acabar bem.
  migrate:
    build: .
    image: iris-engine:local
    command: ['node', 'dist/db/migrate-cli.js']
    environment:
      DATABASE_URL: postgres://iris:iris@postgres:5432/iris
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  iris-engine:
    build: .
    image: iris-engine:local
    env_file:
      - path: .env
        required: false
    ports:
      - '${PORT:-8080}:8080'
    environment:
      PORT: 8080
      DATABASE_URL: postgres://iris:iris@postgres:5432/iris
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

  # Comandos de administração (clientes, orgs, chaves):
  #   docker compose run --rm admin create-tenant --slug iris-dev --name "IRIS Dev"
  admin:
    build: .
    image: iris-engine:local
    entrypoint: ['node', 'dist/admin/cli.js']
    environment:
      DATABASE_URL: postgres://iris:iris@postgres:5432/iris
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ['tools']

volumes:
  pgdata:
